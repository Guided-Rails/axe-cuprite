inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - "lib/axe/cuprite/vendor/**/*"
    - "vendor/**/*"

Style/FrozenStringLiteralComment:
  Enabled: true

# The codebase uses double-quoted strings throughout; keep that convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
